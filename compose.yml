services:
  # =====================================
  # N8N - Plateforme de workflow
  # =====================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      #- "127.0.0.1:5678:5678"
      - 5678:5678
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL} # ou peut être https
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      #- WEBHOOK_URL=${WEBHOOK_URL}
      #- N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      #- N8N_PROXY_HOPS=${N8N_PROXY_HOPS}
      #- NODE_ENV=${NODE_ENV}
      #- N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED}
      #- N8N_SSL_CERT: /certs/fullchain.pem
      #- N8N_SSL_KEY: /certs/privkey.pem

      # Credential
      - DB_TYPE=${DB_TYPE}
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - ./certs:/certs:ro
    depends_on:
      - postgres
    networks:
      - ai_network
  
  postgres:
    image: postgres:16
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_network


  # =====================================
  # OLLAMA - Serveur de modèles IA locaux
  # =====================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    # Facultatif : accès depuis Ubuntu uniquement
    expose:
      - 11434

    environment:
      OLLAMA_HOST: 0.0.0.0:11434

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        echo "Attente du démarrage d'Ollama..."

        until ollama list >/dev/null 2>&1; do
          sleep 5
        done

        echo "Téléchargement des modèles..."

        ollama serve

        ollama pull llama3.2

        echo "Tous les modèles sont prêts."

    #networks:
      #- ai-network

volumes:
  n8n_data:
  postgres_data:
  ollama_data:

#networks:
  #ai_network:
    #driver: bridge