services:
  # =====================================
  # N8N - Plateforme de workflow
  # =====================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      #- "127.0.0.1:5678:5678"
      - 5678:5678
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL} # ou peut être https
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      #- WEBHOOK_URL=${WEBHOOK_URL}
      #- N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      #- N8N_PROXY_HOPS=${N8N_PROXY_HOPS}
      #- NODE_ENV=${NODE_ENV}
      #- N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED}
      #- N8N_SSL_CERT: /certs/fullchain.pem
      #- N8N_SSL_KEY: /certs/privkey.pem

      # Credential
      #- DB_TYPE=${DB_TYPE}
      #- DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      #- DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      #- DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      #- DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - ./certs:/certs:ro
    depends_on:
      #- postgres
      ollama:
        condition: service_healthy
    #networks:
      #- ai_network
  
  #postgres:
    #image: postgres:16
    #container_name: ai-postgres
    #restart: unless-stopped
    #environment:
      #POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
      #POSTGRES_USER: ${DB_POSTGRESDB_USER}
      #POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
    #volumes:
      #- postgres_data:/var/lib/postgresql/data
    #networks:
      #- ai_network


  # =====================================
  # OLLAMA - Serveur de modèles IA locaux
  # =====================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_HOST: 0.0.0.0:11434

    # API accessible uniquement depuis la machine virtuel.
    # n8n utilise le réseau Docker interne.
    ports:
      - "127.0.0.1:11434:11434"

    # Démarrage du serveur et installation initiale des modèles.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        echo "Demarrage du serveur Ollama..."

        ollama serve &
        OLLAMA_PID=$$!

        trap 'kill "$$OLLAMA_PID" 2>/dev/null || true' TERM INT

        echo "Attente de la disponibilite de l'API Ollama..."

        until ollama list >/dev/null 2>&1; do
          sleep 3
        done

        echo "API Ollama disponible."

        if [ ! -f /root/.ollama/.models-ready ]; then

          echo "Installation des modeles..."

          # Assistant généraliste et agent léger
          ollama pull llama3.2

          #Classification de sécurité des entrées et sorties
          #ollama pull llama-guard3:8b
          
          # Agent pour des tâches de raisonnement plus complexes
          # ollama pull glm-4.7-flash

          # Classification, extraction et automatisation. Modèle léger d'automatisation et de comparaison expérimentale.
          # ollama pull qwen2.5:3b

          #Tests comparatifs de sécurité
          # ollama pull ministral-3:8b


          touch /root/.ollama/.models-ready

          echo "Installation des modeles terminee."

        else
          echo "Les modeles ont deja ete initialises."
        fi

        echo "Modeles disponibles :"
        ollama list

        wait "$$OLLAMA_PID"

    # Ollama est considéré sain lorsque les modèles sont installés.
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /root/.ollama/.models-ready && ollama list >/dev/null 2>&1"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

    #networks:
      #- ai-network

volumes:
  n8n_data:
  postgres_data:
  ollama_data:

#networks:
  #ai_network:
    #driver: bridge